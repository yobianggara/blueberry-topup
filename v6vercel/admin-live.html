<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — Blueberry Topup</title><link rel="stylesheet" href="/style.css"></head><body>
<header class="top"><a href="/">← Kembali ke Toko</a><b>Admin</b></header>
<main style="max-width:1000px;margin:20px auto;padding:0 16px">
<div id="gate" class="card" style="width:100%"><h2>Masuk Admin</h2><p class="muted">PIN tersimpan aman di server. Tidak tersimpan di browser / file website.</p><label>PIN Admin</label><input id="pin" type="password" autocomplete="off"><button class="primary" onclick="login()">Masuk</button><p id="err"></p></div>
<div id="panel" class="hidden">
<div class="kpi" id="kpi"></div>
<div class="card" style="width:100%;margin-top:14px"><h3>Perbarui Katalog</h3><p class="muted">Mengambil harga terbaru dari sistem internal, lalu memperbarui harga jual di toko.</p><button class="primary" onclick="sync()">Perbarui Harga Sekarang</button><p id="syncOut"></p></div>
<div class="card" style="width:100%;margin-top:14px"><h3>Laporan Penjualan</h3><div style="display:flex;gap:8px"><select id="range"><option value="today">Hari Ini</option><option value="7d">7 Hari Terakhir</option><option value="30d">30 Hari Terakhir</option><option value="all">Semua</option></select><button class="primary" style="width:auto" onclick="loadReport()">Tampilkan</button></div><div id="report"></div></div>
<div class="card" style="width:100%;margin-top:14px"><h3>Pesanan Terbaru</h3><div id="orders"></div></div>
</div></main>
<script>let TOKEN='';
async function login(){const r=await fetch('/api/admin-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin:document.getElementById('pin').value})});const j=await r.json();if(!j.ok){document.getElementById('err').textContent='PIN salah.';return}TOKEN=j.token;document.getElementById('gate').classList.add('hidden');document.getElementById('panel').classList.remove('hidden');loadAll();}
async function loadAll(){const r=await fetch('/api/admin-dashboard',{headers:{Authorization:'Bearer '+TOKEN}});const j=await r.json();if(!j.ok)return alert('Sesi berakhir. Login ulang.');document.getElementById('kpi').innerHTML=`<div><span>Total Produk</span><br><b>${j.products}</b></div><div><span>Pesanan Hari Ini</span><br><b>${j.today_orders}</b></div><div><span>Omzet Hari Ini</span><br><b>Rp ${(j.today_revenue||0).toLocaleString('id-ID')}</b></div><div><span>Menunggu Bayar</span><br><b>${j.pending}</b></div>`;document.getElementById('orders').innerHTML=(j.orders||[]).map(o=>`<div style="display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding:8px 0"><span><b>${o.invoice}</b> — ${o.product_name}<br><small>${o.method_label} • ${o.status}</small></span><b>Rp ${Number(o.amount||0).toLocaleString('id-ID')}</b></div>`).join('')||'Belum ada pesanan.';loadReport();}
async function sync(){document.getElementById('syncOut').textContent='Memperbarui...';const r=await fetch('/api/admin-sync-prices',{method:'POST',headers:{Authorization:'Bearer '+TOKEN}});const j=await r.json();document.getElementById('syncOut').textContent=j.ok?`Berhasil. ${j.count} produk diperbarui. Terakhir: ${j.synced_at}`:'Gagal memperbarui.';loadAll();}
async function loadReport(){const range=document.getElementById('range').value;const r=await fetch('/api/admin-report?range='+range,{headers:{Authorization:'Bearer '+TOKEN}});const j=await r.json();document.getElementById('report').innerHTML=`<table><tr><th>Periode</th><th>Pesanan</th><th>Omzet</th><th>Terbayar</th></tr><tr><td>${j.label}</td><td>${j.orders}</td><td>Rp ${(j.revenue||0).toLocaleString('id-ID')}</td><td>${j.paid}</td></tr></table><p class="muted">Rincian per produk tersedia di tabel pesanan. Ekspor lengkap tersedia dari gateway & sistem internal.</p>`;}
</script></body></html>
